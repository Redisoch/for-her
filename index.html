<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Важный вопрос!</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Pangolin&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Pangolin', 'Comic Sans MS', sans-serif;
            background-color: #ffe6e6; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            text-align: center;
            position: relative;
        }
        .hearts-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 1;
        }
        .heart-particle {
            position: absolute; color: #ffb3b3; 
            user-select: none; animation: fall linear infinite; z-index: 1;
        }
        @keyframes fall {
            0% { transform: translateY(-50px) rotate(0deg); opacity: 0; }
            10% { opacity: 0.7; }
            90% { opacity: 0.7; }
            100% { transform: translateY(105vh) rotate(360deg); opacity: 0; }
        }
        .content-wrapper {
            position: relative; z-index: 10;
            max-width: 400px; width: 90%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.4s ease-in-out;
            opacity: 1;
        }
        .gif-container {
            width: 180px; height: 180px; border-radius: 50%; 
            overflow: hidden; box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1); 
            margin-bottom: 20px; border: 4px solid #ffb3b3; background-color: white;
        }
        .gif-container img { width: 100%; height: 100%; object-fit: cover; }
        h1 { color: #b33939; font-size: 2.2rem; margin: 0 0 30px 0; padding: 0 20px; line-height: 1.4; }
        .buttons-block { display: flex; justify-content: space-between; width: 280px; height: 60px; position: relative; }
        button, .submit-btn {
            width: 110px; height: 50px; font-family: inherit; font-size: 1.3rem;
            border: none; border-radius: 12px; cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); transition: background-color 0.2s;
        }
        #yesBtn { background-color: #ffb3b3; color: #4a1515; }
        #yesBtn:hover { background-color: #ff9999; }
        #noBtn { 
            background-color: #ff9999; color: #4a1515; position: absolute; 
            right: 0; top: 0; transition: left 0.15s ease-out, top 0.15s ease-out;
        }
        .form-block { display: none; width: 100%; }
        .date-form {
            display: flex; flex-direction: column; gap: 15px; width: 100%; padding: 20px;
            background: rgba(255, 255, 255, 0.9); border-radius: 20px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.05); box-sizing: border-box;
            max-height: 65vh; 
            overflow-y: auto;  
        }
        .date-form label { color: #b33939; font-size: 1.2rem; text-align: left; margin-bottom: -5px; }
        .date-form input[type="date"], .date-form input[type="time"] {
            padding: 10px; border: 2px solid #ffb3b3; border-radius: 12px;
            font-family: inherit; font-size: 1rem; background: white; outline: none;
        }
        .checkbox-group {display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 5px; padding-bottom: 5px;
        .checkbox-group label {
            display: flex; align-items: center; gap: 8px; background: #ffe0e0;
            padding: 8px 14px; border-radius: 25px; font-size: 0.9rem; color: #4a1515; cursor: pointer; transition: 0.2s;
        }
        .checkbox-group label:hover { background: #ffcccc; }
        .checkbox-group input[type="checkbox"] { accent-color: #ff9999; width: 18px; height: 18px; margin: 0; }
        .submit-btn { background-color: #ffb3b3; color: #4a1515; width: 100%; margin-top: 10px; }
        .submit-btn:hover { background-color: #ff9999; }
    </style>
</head>
<body>

    <div class="hearts-container" id="heartsContainer"></div>

    <div class="content-wrapper" id="mainWrapper">
        <div class="gif-container">
            <img id="moodGif" src="https://media.tenor.com/MKkJWYigjycAAAA1/cute-cat-cat-cute.webp" alt="Милые котики">
        </div>

        <h1 id="mainTitle">Пойдешь со мной на свидание? 😉</h1>
        
        <div class="buttons-block" id="buttonsBlock">
            <button id="yesBtn" onclick="sayYes()">Да!</button>
            <button id="noBtn" onmouseover="moveButton()" onclick="moveButton()">Нет</button>
        </div>

        <div class="form-block" id="formBlock">
            <form class="date-form" id="dateForm" action="https://formsubmit.co/markowsky.daniil@gmail.com" method="POST">
                <input type="hidden" name="_captcha" value="false">
                <input type="hidden" name="_next" value="about:blank">

                <label for="dateInput">Выбери день:</label>
                <input type="date" name="Дата" id="dateInput" required>

                <label for="timeInput">Выбери время:</label>
                <input type="time" name="Время" id="timeInput" required>

                <label>Чем займемся?</label>
                <div class="checkbox-group">
                    <label><input type="checkbox" name="Планы[]" value="С вайбом посидеть"> С вайбом посидеть</label>
                    <label><input type="checkbox" name="Планы[]" value="Кафе"> Кафе</label>
                    <label><input type="checkbox" name="Планы[]" value="Прогулка"> Прогулка</label> 
                    <label><input type="checkbox" name="Планы[]" value="Пицца"> Пицца</label>
                    <label><input type="checkbox" name="Планы[]" value="Шавуха"> Шавуха</label>
                    <label><input type="checkbox" name="Планы[]" value="Выпить пыва"> Выпить пыва</label>
                </div>

                <button type="submit" class="submit-btn">Отправить</button>
            </form>
        </div>
    </div>

    <script>
        const container = document.getElementById('heartsContainer');
        const heartSymbols = ['🍻', '❤️', '🍕', '🔥'];
        
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart-particle');
            heart.innerText = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 3 + 3 + 's';
            heart.style.fontSize = Math.random() * 15 + 15 + 'px';
            container.appendChild(heart);
            setTimeout(() => { heart.remove(); }, 6000);
        }
        setInterval(createHeart, 350);

        function moveButton() {
            const noBtn = document.getElementById('noBtn');
            if (noBtn.style.position !== 'fixed') { noBtn.style.position = 'fixed'; }
            const padding = 30;
            const maxX = window.innerWidth - 120 - padding;
            const maxY = window.innerHeight - 60 - padding;
            const x = Math.max(padding, Math.random() * maxX);
            const y = Math.max(padding, Math.random() * maxY);
            noBtn.style.left = x + 'px'; noBtn.style.top = y + 'px';
        }

        // Переход на анкету + замена гифки
        function sayYes() {
            const wrapper = document.getElementById('mainWrapper');
            const gif = document.getElementById('moodGif');
            wrapper.style.opacity = '0'; 
            
            setTimeout(() => {
                gif.src = "https://media.tenor.com/ZLfVS_sIhA4AAAAM/cat-dance.gif";
                
                document.getElementById('buttonsBlock').style.display = 'none';
                document.getElementById('mainTitle').innerHTML = "Я в тебе не сомневался! 🥰<br>Заполни анкету пж";
                document.getElementById('mainTitle').style.fontSize = "1.8rem";
                document.getElementById('formBlock').style.display = 'block';
                wrapper.style.opacity = '1'; 
            }, 400); 
        }

        // Переход на финал + замена гифки
        document.getElementById('dateForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const form = this;
            const wrapper = document.getElementById('mainWrapper');
            const h1 = document.getElementById('mainTitle');
            const gif = document.getElementById('moodGif');

            fetch(form.action, {
                method: 'POST',
                body: new FormData(form),
                headers: { 'Accept': 'application/json' }
            })
            .then(() => {
                wrapper.style.opacity = '0'; 
                
                setTimeout(() => {
                    document.getElementById('formBlock').style.display = 'none';
                    
                    gif.src = "https://media.tenor.com/3zvcxCJ9QeEAAAAM/tetriandoch.gif";
                    
                    h1.innerHTML = "Ура! 🎉<br><br>С меня хороший вечер ;)<br><br> Если остались вопросы напиши в Тг (>-<)";
                    h1.style.fontSize = "2.1rem";
                    wrapper.style.opacity = '1'; 
                }, 400);
            })
            .catch(error => {
                alert('Ошибка сети. Напиши мне в ТГ! 😉');
                console.error(error);
            });
        });
    </script>
</body>
</html>
