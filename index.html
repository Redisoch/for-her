<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Важный вопрос!</title>
    
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Pangolin&display=swap&subset=cyrillic" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Pangolin', cursive, sans-serif;
            background-color: #ffe6e6; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            text-align: center;
            position: relative;
        }

        .hearts-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; 
            z-index: 1;
        }

        .heart-particle {
            position: absolute;
            color: #ffd1d1; 
            font-size: 24px;
            user-select: none;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(-50px) rotate(0deg); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(105vh) rotate(360deg); opacity: 0; }
        }

        /* Общая обертка для контента, которая будет плавно исчезать и появляться */
        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2;
            transition: opacity 0.5s ease-in-out; /* Плавность растворения экрана */
            opacity: 1;
        }

        .gif-container {
            width: 180px;
            height: 180px;
            border-radius: 50%; 
            overflow: hidden;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1); 
            margin-bottom: 20px;
            border: 4px solid #ff9999; 
            background-color: white;
        }

        .gif-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 {
            color: #b33939; 
            font-size: 2.4rem; 
            margin-top: 0;
            margin-bottom: 40px;
            padding: 0 20px;
            line-height: 1.3;
        }

        .buttons {
            position: relative;
            width: 320px;
            height: 80px;
        }

        button {
            width: 100px;
            height: 50px;
            font-family: 'Pangolin', cursive, sans-serif;
            font-size: 1.3rem;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            position: absolute;
            transition: left 0.3s ease-out, top 0.3s ease-out;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        #yesBtn {
            background-color: #ff9999; 
            color: #4a1515;
            left: 40px;
        }

        #noBtn {
            background-color: #ff8080; 
            color: #4a1515;
            right: 40px;
        }
    </style>
</head>
<body>

    <div class="hearts-container" id="heartsContainer"></div>

    <!-- Обернули всё содержимое в класс main-content для эффекта перетекания -->
    <div class="main-content" id="mainContent">
        <div class="gif-container">
            <img id="moodGif" src=https://media1.tenor.com/m/ZZlzj540X3UAAAAC/%D0%BF%D0%BE%D1%86%D0%B5%D0%BB%D1%83%D0%B9-%D0%BB%D1%8E%D0%B1%D0%BB%D1%8E.gif" alt="Милые котики">
        </div>

        <h1>Пойдешь со мной на свидание? 😉</h1>
        
        <div class="buttons">
            <button id="yesBtn" onclick="sayYes()">Да!</button>
            <button id="noBtn" style="left: 180px; top: 0px;" onmouseover="moveButton()" onclick="moveButton()">Нет</button>
        </div>
    </div>

    <script>
        function createHeart() {
            const container = document.getElementById('heartsContainer');
            if (!container) return;
            const heart = document.createElement('div');
            heart.classList.add('heart-particle');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            const size = Math.random() * 15 + 15; 
            heart.style.fontSize = size + 'px';
            heart.style.animationDuration = Math.random() * 4 + 4 + 's';
            container.appendChild(heart);
            setTimeout(() => { heart.remove(); }, 8000);
        }
        setInterval(createHeart, 400);

        function moveButton() {
            const noBtn = document.getElementById('noBtn');
            const rect = noBtn.getBoundingClientRect();
            const currentX = rect.left;
            const currentY = rect.top;
            
            const radius = 150;
            const angle = Math.random() * Math.PI * 2; 
            const distance = Math.random() * radius + 50; 
            
            let newX = currentX + Math.cos(angle) * distance;
            let newY = currentY + Math.sin(angle) * distance;
            
            const padding = 20;
            if (newX < padding) newX = padding;
            if (newX > window.innerWidth - 120) newX = window.innerWidth - 120;
            if (newY < padding) newY = padding;
            if (newY > window.innerHeight - 70) newY = window.innerHeight - 70;
            
            noBtn.style.position = 'fixed';
            noBtn.style.left = newX + 'px';
            noBtn.style.top = y = newY + 'px';
        }

        // Логика плавного перетекания экранов
        function sayYes() {
            const mainContent = document.getElementById('mainContent');
            const h1 = document.querySelector('h1');
            const buttonsDiv = document.querySelector('.buttons');
            const gif = document.getElementById('moodGif');
            
            // Шаг 1: Делаем первый экран полностью прозрачным
            mainContent.style.opacity = '0';
            
            // Шаг 2: Ждем 500 миллисекунд (пока контент полностью растворится) и меняем его
            setTimeout(() => {
                buttonsDiv.style.display = 'none'; // Убираем кнопки
                
                // Ставим праздничную гифку
                gif.src = "https://media.tenor.com/xXNzEkd7BYYAAAAi/yapapa-cat.gif";
                
                // Обновляем текст
                h1.innerHTML = "Ура! 🎉<br><br>Я знал, что ты согласишься! ❤️<br>С меня вкусный кофе.<br><br>Жду тебя в Telegram, напиши когда свободна! 😉";
                
                // Шаг 3: Возвращаем прозрачность обратно в 1, чтобы новый экран плавно проявился
                mainContent.style.opacity = '1';
            }, 500); 
        }
    </script>

</body>
</html>
