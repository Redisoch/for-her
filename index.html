<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Важный вопрос!</title>
    
    <!-- Подключаем милый округлый шрифт -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Pangolin&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Pangolin', 'Comic Sans MS', sans-serif;
            background-color: #ffe6e6; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            text-align: center;
            position: relative;
        }

        /* Контейнер для падающих сердечек */
        .hearts-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; 
            z-index: 1;
        }

        .heart-particle {
            position: absolute;
            color: #ffb3b3; 
            user-select: none;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(-50px) rotate(0deg); opacity: 0; }
            10% { opacity: 0.7; }
            90% { opacity: 0.7; }
            100% { transform: translateY(105vh) rotate(360deg); opacity: 0; }
        }

        /* Обертка для контента */
        .content-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.4s ease-in-out;
            max-width: 400px;
            width: 90%;
            z-index: 2;
        }

        .gif-container {
            width: 180px;
            height: 180px;
            border-radius: 50%; 
            overflow: hidden;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1); 
            margin-bottom: 20px;
            border: 4px solid #ffb3b3; 
            background-color: white;
        }

        .gif-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 {
            color: #b33939; 
            font-size: 2.2rem;
            margin-top: 0;
            margin-bottom: 40px;
            padding: 0 20px;
            line-height: 1.4;
        }

        .buttons {
            position: relative;
            width: 320px;
            height: 80px;
            display: flex;
            justify-content: center;
            gap: 40px;
        }

        button, .submit-btn {
            width: 110px;
            height: 50px;
            font-family: inherit;
            font-size: 1.3rem;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: background-color 0.2s, transform 0.1s;
        }

        #yesBtn {
            background-color: #ffb3b3; 
            color: #4a1515;
        }

        #yesBtn:hover {
            background-color: #ff9999;
            transform: scale(1.05);
        }

        #noBtn {
            background-color: #ff9999; 
            color: #4a1515;
            position: absolute; 
            right: 40px;
            transition: left 0.15s ease-out, top 0.15s ease-out;
        }

        /* Стили для формы (анкеты) */
        .date-form {
            display: none;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            padding: 20px;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 20px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.05);
            box-sizing: border-box;
        }

        .date-form label {
            color: #b33939;
            font-size: 1.2rem;
            text-align: left;
            margin-bottom: -5px;
        }

        .date-form input[type="date"],
        .date-form input[type="time"] {
            padding: 10px;
            border: 2px solid #ffb3b3;
            border-radius: 12px;
            font-family: inherit;
            font-size: 1rem;
            background: white;
            outline: none;
        }

        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-top: 5px;
        }

        .checkbox-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #ffe0e0;
            padding: 8px 14px;
            border-radius: 25px;
            font-size: 0.9rem;
            color: #4a1515;
            cursor: pointer;
            transition: 0.2s;
        }

        .checkbox-group label:hover {
            background: #ffcccc;
        }

        .checkbox-group input[type="checkbox"] {
            accent-color: #ff9999;
            width: 18px;
            height: 18px;
            margin: 0;
        }

        .submit-btn {
            background-color: #ffb3b3;
            color: #4a1515;
            width: 100%;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background-color: #ff9999;
        }
    </style>
</head>
<body>

    <!-- Контейнер для падающих сердечек -->
    <div class="hearts-container" id="heartsContainer"></div>

    <div class="content-wrapper" id="mainContent">
        <div class="gif-container">
            <img id="moodGif" src="https://tenor.com" alt="Милые котики">
        </div>

        <h1 id="mainTitle">Пойдешь со мной на свидание? 😉</h1>
        
        <!-- Первый экран: Кнопки -->
        <div class="buttons" id="buttonsBlock">
            <button id="yesBtn" onclick="sayYes()">Да!</button>
            <button id="noBtn" onmouseover="moveButton()" onclick="moveButton()">Нет</button>
        </div>

        <!-- Второй экран: Анкета (Данные уйдут на FormSubmit) -->
        <!-- ТУТ ЗАМЕНИТЕ your-email@gmail.com НА ВАШУ РЕАЛЬНУЮ ПОЧТУ -->
        <form class="date-form" id="dateForm" action="https://formsubmit.co" method="POST">
            <!-- Отключаем капчу, чтобы девушке не вылазили картинки со светофорами -->
            <input type="hidden" name="_captcha" value="false">
            <!-- Страница, куда перенаправит после отправки (оставляем этот же сайт) -->
            <input type="hidden" name="_next" value="about:blank">

            <label for="dateInput">Выбери день:</label>
            <input type="date" name="Дата свидания" id="dateInput" required>

            <label for="timeInput">Выбери время:</label>
            <input type="time" name="Время" id="timeInput" required>

            <label>Чем займемся?</label>
            <div class="checkbox-group">
                <label><input type="checkbox" name="План[]" value="Кино"> Кино</label>
                <label><input type="checkbox" name="План[]" value="Кафе"> Кафе</label>
                <label><input type="checkbox" name="План[]" value="Прогулка"> Прогулка</label>
                <label><input type="checkbox" name="План[]" value="Поедим пиццу"> Поедим пиццу</label>
            </div>

            <button type="submit" class="submit-btn">Отправить ответ</button>
        </form>
    </div>

    <script>
        // --- 1. ГЕНЕРАЦИЯ СЕРДЕЧЕК ---
        const container = document.getElementById('heartsContainer');
        const heartSymbols = ['❤️', '💖', '💝', '💕', '🌸'];
        
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart-particle');
            heart.innerText = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 3 + 3 + 's'; // от 3 до 6 секунд
            heart.style.fontSize = Math.random() * 15 + 15 + 'px'; // размер от 15px до 30px
            container.appendChild(heart);

            // Удаляем сердечко после окончания анимации
            setTimeout(() => { heart.remove(); }, 6000);
        }
        setInterval(createHeart, 300); // Создавать новое сердечко каждые 300мс

        // --- 2. УБЕГАЮЩАЯ КНОПКА ---
        function moveButton() {
            const noBtn = document.getElementById('noBtn');
            if (noBtn.style.position !== 'fixed') { noBtn.style.position = 'fixed'; }

            const padding = 20;
            const maxX = window.innerWidth - 110 - padding;
            const maxY = window.innerHeight - 50 - padding;

            const x = Math.max(padding, Math.random() * maxX);
            const y = Math.max(padding, Math.random() * maxY);
            
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
        }

        // --- 3. НАЖАТИЕ НА «ДА» ---
        function sayYes() {
            const wrapper = document.getElementById('mainContent');
            const h1 = document.getElementById('mainTitle');
            const buttonsDiv = document.getElementById('buttonsBlock');
            const dateForm = document.getElementById('dateForm');
            const gif = document.getElementById('moodGif');
            
            wrapper.style.opacity = '0';
            
            setTimeout(() => {
                buttonsDiv.style.display = 'none';
                h1.innerHTML = " Прекрасный выбор! Заполни анкету:";
                h1.style.fontSize = "1.8rem";
                h1.style.marginBottom = "20px";
                
                // Показываем форму
                dateForm.style.display = 'flex';
                wrapper.style.opacity = '1';
            }, 400);
        }
        // --- 4. ПЕРЕХВАТ ОТПРАВКИ ФОРМЫ ---
        document.getElementById('dateForm').addEventListener('submit', function(e) {e.preventDefault(); 
        // Останавливаем стандартную перезагрузку страницы
            const form = this;
            const wrapper = document.getElementById('mainContent');
            const h1 = document.getElementById('mainTitle');
            const gif = document.getElementById('moodGif');
        // Отправляем данные на почту в фоновом режиме через fetch
        fetch(form.action, {method: 'POST',body: new FormData(form),headers: { 'Accept': 'application/json' }}).then(() => {
            // Когда данные успешно ушли, плавно показываем экран финала
        wrapper.style.opacity = '0';setTimeout(() => {form.style.display = 'none';gif.src = "tenor.com"; 
        // Веселый кот
        h1.innerHTML = "Ура! 🎉Ответ отправлен мне на почту! ❤️С меня вкусный кофе. Жду тебя в Telegram, спишемся! 😉";
        h1.style.fontSize = "2.2rem";
        wrapper.style.opacity = '1';}, 400);}).catch(error => {alert('Ой, что-то пошло не так при отправке. Напиши мне в ТГ!');
        console.error(error);});});
