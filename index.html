<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Важный вопрос!</title>
    
    <!-- Подключаем милый округлый шрифт, который будет работать везде, включая телефоны -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Pangolin&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Pangolin', 'Comic Sans MS', sans-serif;
            background-color: #ffe6e6; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            text-align: center;
        }

        /* Обертка для контента, чтобы плавно менять экраны */
        .content-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.3s ease-in-out;
            max-width: 400px;
            width: 90%;
        }

        .gif-container {
            width: 180px;
            height: 180px;
            border-radius: 50%; 
            overflow: hidden;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1); 
            margin-bottom: 20px;
            border: 4px solid #ffb3b3; 
            background-color: white;
        }

        .gif-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 {
            color: #b33939; 
            font-size: 2.2rem;
            margin-top: 0;
            margin-bottom: 40px;
            padding: 0 20px;
            line-height: 1.4;
        }

        .buttons {
            position: relative;
            width: 320px;
            height: 80px;
            display: flex;
            justify-content: center;
            gap: 40px;
        }

        button {
            width: 110px;
            height: 50px;
            font-family: inherit;
            font-size: 1.3rem;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: background-color 0.2s, transform 0.1s;
        }

        #yesBtn {
            background-color: #ffb3b3; 
            color: #4a1515;
        }

        #yesBtn:hover {
            background-color: #ff9999;
            transform: scale(1.05);
        }

        #noBtn {
            background-color: #ff9999; 
            color: #4a1515;
            position: absolute; /* Оставляем абсолютным изначально */
            right: 40px;
            transition: left 0.15s ease-out, top 0.15s ease-out; /* Плавный побег кнопки */
        }
    </style>
</head>
<body>

    <div class="content-wrapper" id="mainContent">
        <div class="gif-container">
            <img id="moodGif" src="https://media1.tenor.com/m/ZZlzj540X3UAAAAC/%D0%BF%D0%BE%D1%86%D0%B5%D0%BB%D1%83%D0%B9-%D0%BB%D1%8E%D0%B1%D0%BB%D1%8E.gif" alt="Милые котики">
        </div>

        <h1>Пойдешь со мной на свидание? 😉</h1>
        
        <div class="buttons">
            <button id="yesBtn" onclick="sayYes()">Да!</button>
            <button id="noBtn" onmouseover="moveButton()" onclick="moveButton()">Нет</button>
        </div>
    </div>

    <script>
        function moveButton() {
            const noBtn = document.getElementById('noBtn');
            
            // Если кнопка еще не прыгала, переключаем ее на fixed для свободы перемещения
            if (noBtn.style.position !== 'fixed') {
                noBtn.style.position = 'fixed';
            }

            // Вычисляем безопасные границы (ширина экрана минус ширина кнопки (110px) и отступы)
            const padding = 20;
            const maxX = window.innerWidth - 110 - padding;
            const maxY = window.innerHeight - 50 - padding;

            // Рандомим координаты строго внутри видимого экрана
            const x = Math.max(padding, Math.random() * maxX);
            const y = Math.max(padding, Math.random() * maxY);
            
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
        }

        function sayYes() {
            const wrapper = document.getElementById('mainContent');
            const h1 = document.querySelector('h1');
            const buttonsDiv = document.querySelector('.buttons');
            const gif = document.getElementById('moodGif');
            
            // Плавно скрываем старый контент
            wrapper.style.opacity = '0';
            
            setTimeout(() => {
                buttonsDiv.style.display = 'none';
                gif.src = "https://media.tenor.com/xXNzEkd7BYYAAAAi/yapapa-cat.gif";
                
                h1.innerHTML = "Ура! 🎉<br><br>Я знал, что ты согласишься! ❤️<br>С меня вкусный кофе.<br><br>Жду тебя в Telegram, напиши когда свободна! 😉";
                
                // Плавно проявляем новый контент
                wrapper.style.opacity = '1';
            }, 300); // Время совпадает с переходом в CSS
        }
    </script>

</body>
</html>
