<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Важный вопрос!</title>
    
    <!-- ПОДКЛЮЧАЕМ КРАСИВЫЙ ШРИФТ ИЗ ИНТЕРНЕТА, КОТОРЫЙ ОТКРОЕТСЯ НА ВСЕХ ТЕЛЕФОНАХ -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Neucha&display=swap" rel="stylesheet">
    
    <style>
        body {
            /* Применяем наш новый веб-шрифт Neucha */
            font-family: 'Neucha', cursive, sans-serif;
            background-color: #ffe6e6; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            text-align: center;
        }

        .gif-container {
            width: 180px;
            height: 180px;
            border-radius: 50%; 
            overflow: hidden;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1); 
            margin-bottom: 20px;
            border: 4px solid #ffb3b3; 
            background-color: white;
        }

        .gif-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 {
            color: #b33939; 
            /* Немного увеличил размер для нового шрифта, чтобы выглядело сочнее */
            font-size: 2.6rem; 
            margin-top: 0;
            margin-bottom: 40px;
            padding: 0 20px;
            line-height: 1.2;
        }

        .buttons {
            position: relative;
            width: 320px;
            height: 80px;
        }

        button {
            width: 100px;
            height: 50px;
            /* Кнопкам тоже задаем новый красивый шрифт */
            font-family: 'Neucha', cursive, sans-serif;
            font-size: 1.4rem;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            position: absolute;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        #yesBtn {
            background-color: #ffb3b3; 
            color: #4a1515;
            left: 40px;
        }

        #noBtn {
            background-color: #ff9999; 
            color: #4a1515;
            right: 40px;
        }
    </style>
</head>
<body>

    <div class="gif-container">
        <img id="moodGif" src="https://tenor.com" alt="Милые котики">
    </div>

    <h1>Пойдешь со мной на свидание? 😉</h1>
    
    <div class="buttons">
        <button id="yesBtn" onclick="sayYes()">Да!</button>
        <button id="noBtn" onmouseover="moveButton()" onclick="moveButton()">Нет</button>
    </div>

    <script>
        function moveButton() {
            const noBtn = document.getElementById('noBtn');
            const x = Math.random() * (window.innerWidth - 120);
            const y = Math.random() * (window.innerHeight - 70);
            
            noBtn.style.position = 'fixed';
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
        }

        function sayYes() {
            const h1 = document.querySelector('h1');
            const buttonsDiv = document.querySelector('.buttons');
            const gif = document.getElementById('moodGif');
            
            buttonsDiv.style.display = 'none';
            
            gif.src = "https://giphy.com";
            
            h1.innerHTML = "Ура! 🎉<br><br>Я знал, что ты согласишься! ❤️<br>С меня вкусный кофе.<br><br>Жду тебя в Telegram, напиши когда свободна! 😉";
            h1.style.color = "#b33939"; 
        }
    </script>

</body>
</html>
